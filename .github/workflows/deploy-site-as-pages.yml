# Simple workflow for deploying static content to GitHub Pages
name: 部署仓库 site/ 静态内容到Pages
on:
  push:
    branches: ["main"]
    paths:
      - 'site/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
      - name: 配置Pages环境
        uses: actions/configure-pages@v5
      - name: 上传内容
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site/'
      - name: 部署到Pages
        id: deployment
        uses: actions/deploy-pages@v5
